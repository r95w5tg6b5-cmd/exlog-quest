 put2(2,'例6',179,'319',1,String.raw`${base}^{\frac{${k}}{${n}}}`,String(v),[String(v+1),String(base),String(b+k)],
 '分数指数の分母は累乗根、分子はその後の累乗を表します。', [String.raw`\(${base}^{\frac{${k}}{${n}}}=(\sqrt[${n}]{${base}})^{${k}}\)。`,String.raw`\(\sqrt[${n}]{${base}}=${b}\) より \(${b}^{${k}}=${v}\)。`]);
 if(k===1)put2(2,'練習6',179,'320',2,String.raw`${base}^{-\frac1{${n}}}`,rr(1,b),[String(-b),String(b),String.raw`-\frac1{${b}}`],
 '分数指数と負の指数を順に処理します。', [String.raw`\(${base}^{-\frac1{${n}}}=\frac1{\sqrt[${n}]{${base}}}\)。`,String.raw`\(\sqrt[${n}]{${base}}=${b}\) より \(\frac1{${b}}\)。`]);
}
for(let b of [2,3,4,5])for(let k of [2,3,4]){

 put2(2,'例題1',180,'321',2,String.raw`${b}^{\frac{${k+1}}3}\cdot${b}^{\frac{${2-k}}3}`,String(b),[String(b**2),String(3*b),String(k+1)],
 '同じ底の累乗の積なら、有理数指数でも指数を足せます。', [String.raw`指数は \(\frac{${k+1}}3+\frac{${2-k}}3=1\)。`,String.raw`\(${b}^1=${b}\) となる。`]);
 put2(2,'練習7',181,'324',3,String.raw`\frac{(${v}^{\frac12})^2}{${b}^{${k-1}}}`,String(b),[String(v),String(k),String(b*b)],
 '累乗と除法を一つずつ整理し、同じ底にそろえます。', [String.raw`分子は \((${v}^{\frac12})^2=${v}\)。`,String.raw`\(\frac{${v}}{${b}^{${k-1}}}=${b}^{${k}-${k-1}}=${b}\)。`]);
}
// 第4章：指数関数の表・グラフ／問題集330～332、335
for(let a of [2,3,4])for(let x of [-2,-1,0,1,2]){

 let wrong=x<0?[String(a**(-x)),String.raw`-\frac1{${a**(-x)}}`,rr(1,a**(-x+1))]:[String(a**(x+1)),String(a**x+1),String(a**(x+2))];
 put2(3,'練習9',183,'330',1,String.raw`y=${a}^x,\;x=${x}\text{ のとき }y`,v,wrong,
 'グラフ上の点は、xの値を式に代入して求めます。', [String.raw`\(x=${x}\) を代入し \(y=${a}^{${x}}\)。`,String.raw`\(y=${v}\)。`,String.raw`\(${a}>1\) なのでグラフは右上がり。`],{kind:'graph',gx:x,error:'負の指数では、正の整数ではなくその逆数になることに注意。'});
}
for(let a of [2,3,4])for(let shift of [-2,-1,1,2]){

 'xを代入してから、グラフの上下方向の平行移動を考えます。',[String.raw`\(${a}^2=${a*a}\)。`,String.raw`したがって \(y=${a*a}${shift>=0?'+':''}${shift}=${v}\)。`]);

// 第5章：比較・大小関係／問題集333、336
for(let base of [2,3,5])for(let k of [1,2,3,4,5]){
 put2(4,'例題2',184,'333',2,String.raw`${base}^{x}>${base}^{${k}}`,String.raw`x>${k}`,[String.raw`x<${k}`,String.raw`x\geqq${k}`,String.raw`x>${k+1}`],
 '底が1より大きいので指数の大小関係をそのまま比較します。',[String.raw`\(${base}>1\) なので \(${base}^x\) は増加関数。`,String.raw`よって \(x>${k}\)。`]);
 put2(4,'練習11',184,'333',2,String.raw`\left(\frac1{${base}}\right)^x\leqq\left(\frac1{${base}}\right)^{${k}}`,String.raw`x\geqq${k}`,[String.raw`x\leqq${k}`,String.raw`x>${k}`,String.raw`x<${k}`],
 '底が0と1の間なので不等号の向きが逆になります。',[String.raw`\(0<\frac1{${base}}<1\) のため減少関数。`,String.raw`したがって \(x\geqq${k}\)。`],{error:'底が1より小さい場合は、不等号の向きを必ず逆にします。'});

// 第6章：指数方程式、置換、二次不等式／問題集334、337～339
for(let b of [2,3,4])for(let n of [1,2,3,4]){
 put2(5,'例題3',185,'334',2,String.raw`${b}^{x+2}=${b}^{${n+2}}`,String.raw`x=${n}`,[String.raw`x=${n+2}`,String.raw`x=${n-2}`,String.raw`x=-${n}`],
 '底をそろえたら指数を等しく置きます。',[String.raw`底は \(${b}>0,\;${b}\ne1\)。`,String.raw`\(x+2=${n+2}\) より \(x=${n}\)。`]);
 put2(5,'練習12',185,'334',2,String.raw`${b}^{2x}\geqq${b}^{${2*n}}`,String.raw`x\geqq${n}`,[String.raw`x\leqq${n}`,String.raw`x>${n}`,String.raw`x\geqq${2*n}`],
 '底が1より大きいことを確かめ、指数の不等式にします。',[String.raw`\(${b}>1\) なので \(2x\geqq${2*n}\)。`,String.raw`両辺を2で割り \(x\geqq${n}\)。`]);
}
for(let b of [2,3])for(let p of [1,2])for(let d of [1,2]){
 let z=p+d,c1=b**p,c2=b**z,A=c1+c2,B=c1*c2;
 let oth=String.raw`x=${p},\;${z}`, ww=[String.raw`x=${p}`,String.raw`x=${z}`,String.raw`x=${p-1},\;${z+1}`];
 put2(5,'例題4',185,'337',3,String.raw`${b}^{2x}-${A}\cdot${b}^x+${B}=0`,oth,ww,
 '二次方程式の形なので、指数関数全体を文字に置き換えます。', [String.raw`\(t=${b}^x\;(t>0)\) とおく。`,String.raw`\(t^2-${A}t+${B}=(t-${c1})(t-${c2})=0\)。`,String.raw`\(t=${c1},${c2}\) から \(x=${p},${z}\)。`],{error:'置いた文字には t>0 という条件があります。また、最後に x に戻します。'});
 put2(5,'練習13',185,'338',3,String.raw`${b}^{2x}-${A}\cdot${b}^{x}+${B}\leqq0`,String.raw`${p}\leqq x\leqq${z}`,[String.raw`x\leqq${p}`,String.raw`x\geqq${z}`,String.raw`${p}<x<${z}`],
 '置換して二次不等式を解き、指数に戻します。',[String.raw`\(t=${b}^x>0\) とおく。`,String.raw`\((t-${c1})(t-${c2})\leqq0\) より \(${c1}\leqq t\leqq${c2}\)。`,String.raw`\(${b}>1\) より \(${p}\leqq x\leqq${z}\)。`]);
}
for(let b of [2,3,4])for(let k of [1,2,3]){
 const c=b**k;
 put2(5,'応用例題1',186,'339',3,String.raw`y=(${b}^x-${c})^2+${k}\text{ の最小値}`,String(k),[String(k+1),String(c),String(c+k)],
 '平方が0以上であることと、指数関数の値域を使います。',[String.raw`\(t=${b}^x>0\) とおくと \(y=(t-${c})^2+${k}\)。`,String.raw`\(t=${c}>0\) は実現できる。`,String.raw`したがって最小値は \(${k}\)（\(x=${k}\) のとき）。`]);
 put2(5,'練習14',186,'337',3,String.raw`${b}^{2x}-${2*c}\cdot${b}^x+${c*c}=0`,String.raw`x=${k}`,[String.raw`x=${k+1}`,String.raw`x=${k-1}`,String.raw`x=-${k}`],
 '完全平方の形に整理します。',[String.raw`\(( ${b}^x-${c})^2=0\)。`,String.raw`\(${b}^x=${c}=${b}^{${k}}\) より \(x=${k}\)。`]);
 put2(5,'練習15',186,'338',3,String.raw`${b}^{2x}-${2*c}\cdot${b}^x+${c*c}>0`,String.raw`x\ne${k}`,[String.raw`x=${k}`,String.raw`x>${k}`,String.raw`x<${k}`],
 '平方が正になるのは、括弧の中が0でないときです。',[String.raw`\(( ${b}^x-${c})^2>0\)。`,String.raw`\(${b}^x\ne${c}\) なので \(x\ne${k}\)。`]);
}
// 第7章：対数の定義・指数との往復／問題集340、341
for(let b of [2,3,5])for(let k of [1,2,3,4]){
 let v=b**k;
 put2(6,'例7',189,'340',1,String.raw`${b}^{${k}}=${v}\text{ を対数の式にすると？}`,String.raw`\log_${b}{${v}}=${k}`,[String.raw`\log_${v}{${b}}=${k}`,String.raw`\log_${b}{${k}}=${v}`,String.raw`\log_${v}{${k}}=${b}`],
 '指数と対数は同じ関係を別の書き方で表したものです。',[String.raw`指数の底は \(${b}\)、指数は \(${k}\)、結果が \(${v}\)。`,String.raw`\(\log_${b}{${v}}=${k}\) と表す。`]);
 put2(6,'練習16',189,'340',1,String.raw`\log_${b}{${v}}`,String(k),[String(k+1),String(v),String(b)],

 put2(6,'練習17',189,'341',2,String.raw`\log_${b}{\frac1{${v}}}`,String(-k),[String(k),String(-k-1),String(b)],

 put2(6,'例8',190,'341',2,String.raw`\log_${b}{${v}}+\log_${b}{\frac1{${v}}}`,'0',['1',String(k),String(-k)],

 put2(6,'練習18',190,'341',2,String.raw`\log_${b}{${b*b}}-\log_${b}{${b}}`,'1',['2','0',String(b)],

// 第8章：対数の性質・積／商／累乗／問題集342～345
for(let b of [2,3,5])for(let m of [1,2,3])for(let n of [1,2,3]){
 const A=b**m,B=b**n;
 put2(7,'練習20',191,'342',2,String.raw`\log_${b}{${A}}+\log_${b}{${B}}`,String(m+n),[String(m+n+1),String(m*n),String(m+n+2)],
 '真数どうしの掛け算は、対数の足し算に変わります。',[String.raw`\(\log_${b}{${A}}+\log_${b}{${B}}=\log_${b}(${A}\times${B})\)。`,String.raw`\(\log_${b}{${b**(m+n)}}=${m+n}\)。`]);
 if(m>n)put2(7,'練習20',191,'345',3,String.raw`\log_${b}{${A}}-\log_${b}{${B}}`,String(m-n),[String(m+n),String(m*n),String(m-n+1)],
 '同じ底の対数の差は、真数の商を対数にまとめます。',[String.raw`\(\log_${b}{${A}}-\log_${b}{${B}}=\log_${b}\frac{${A}}{${B}}\)。`,String.raw`\(\log_${b}{${b**(m-n)}}=${m-n}\)。`]);
}
// 第9章：底の変換公式／問題集343、346～349
for(let b of [2,3,5])for(let m of [2,3,4])for(let n of [1,2,3])if(m!==n){
 let x=b**m,y=b**n,ans=rational(n,m),w=[rational(m,n),String(m+n),String(m*n)];

 '底を同じ数に変換して分子・分母を比較します。',[String.raw`\(\log_{${x}}{${y}}=\frac{\log_${b}{${y}}}{\log_${b}{${x}}}\)。`,String.raw`\(=\frac{${n}}{${m}}=${ans}\)。`]);
 put2(8,'練習21',192,'346',3,String.raw`\log_${b}{${y}}\cdot\log_{${y}}{${x}}`,String(m),[String(n),String(m+n),String(m*n)],
 '底をそろえると途中の対数が約分されます。',[String.raw`\(\log_${b}{${y}}=${n}\)。`,String.raw`\(\log_{${y}}{${x}}=\frac{${m}}{${n}}\)。`,String.raw`積は \(${n}\times\frac{${m}}{${n}}=${m}\)。`]);
}
// 第10章：対数グラフ・増減・変換／問題集351～356
for(let b of [2,3,4])for(let k of [-2,-1,0,1,2,3]){
 let xx=k<0?rr(1,b**(-k)):String(b**k);

for(let [a,c,m,n] of [[3,2,2,3],[4,3,2,3],[3,2,3,4],[5,4,2,3],[4,2,2,4]]){

// 第11章：真数条件、二つの対数、対数不等式／問題集354、357～359
for(let b of [2,3,5])for(let c of [1,2,3,4]){
 const v=c+b*b;

for(let b of [2,3])for(let delta of [2,3,4,5]){

 '積の対数にまとめ、二次方程式を解いて不要な解を除きます。',[String.raw`真数条件：\(x>${u}\)。`,String.raw`\((x-${u})(x-${v})=${b*b}\)。`,String.raw`整理すると \((x-${t})(x-${other})=0\)。`,String.raw`\(x=${t},${other}\) のうち \(x>${u}\) を満たす \(x=${t}\) だけが解。`],{error:'二次方程式で出てきた解がすべて適するとは限りません。真数条件に注意。'});

for(let b of [2,3,4])for(let c of [1,2,3]){

// 第12章：対数の二次式・最大最小／問題集 CONNECT32、360～362

function makeDeck(i){
 const list=availableQuestions(i);
 if(i===13){ // 最終決戦は単元の順序で幅広く復習
   const order=Array.from({length:13},(_,n)=>n);
   const stageGroups=order.map(n=>shuffle(list.filter(z=>z.skill===n)));
   const out=[],seen=new Set();
   while(out.length<Math.min(list.length,Math.max(goalFor(i)+8,28))){
     let found=false;
     for(let n of order){let q=stageGroups[n].shift();if(q&&!seen.has(q.id)){out.push(q);seen.add(q.id);found=true}}
     if(!found)break;
   }
   return out;
 }
 const targets=refMap[i]?.map(x=>x[0])||[],out=[],seen=new Set();
 // 数字だけは変わる。例→練習→例→練習を教材の順に進む。
 for(const ref of [...targets,...new Set(list.map(x=>x.example||'その他'))].filter((v,n,a)=>a.indexOf(v)===n)){
   let items=list.filter(q=>(q.example||'その他')===ref);
   if(!items.length)continue;
   let groups=new Map();
   for(let item of shuffle(items)){
      let typ=item.subpart||0;
      if(!groups.has(typ))groups.set(typ,[]);
      groups.get(typ).push(item);
   }
   const variants=[...groups.keys()].sort((a,b)=>a-b);
   // 一度に同じ型ばかり出さず、まず各小問を1題ずつ。
   const count=Math.min(items.length,(targetParts[i]||{})[ref]||Math.max(1,Math.ceil(goalFor(i)/targets.length)));
   for(let n=0;n<count;n++){
      let q=null;
      for(let seek=0;seek<variants.length;seek++){
       let key=variants[(n+seek)%variants.length];
       let cand=groups.get(key)?.find(x=>!seen.has(x.id));
       if(cand){q=cand;break}
      }
      if(!q)q=items.find(x=>!seen.has(x.id));
      if(q){out.push(q);seen.add(q.id)}
   }
 }
 // 不足した場合は同じ参照の未出題類題を教材順に追加する。
 const minimum=Math.max(goalFor(i),Math.min(list.length,Object.values(targetParts[i]||{}).reduce((a,b)=>a+b,0)));
 if(out.length<minimum){
   for(const ref of targets){
     let rest=shuffle(list.filter(q=>q.example===ref&&!seen.has(q.id)));
     for(const q of rest){out.push(q);seen.add(q.id);if(out.length>=minimum)break}
     if(out.length>=minimum)break;
   }
 }
 return out;
}

// Five-question independent mastery assessment. No hints, no remediation, no retry of same question during the test.
function masteryDeck(i){
 const list=shuffle(availableQuestions(i));
 let eligible=shuffle(list.filter(supportsInput)),a=eligible.slice(0,3);
 let taken=new Set(a.map(x=>x.id));
 for(const item of list){if(a.length===5)break;if(!taken.has(item.id)){a.push(item);taken.add(item.id)}}
 return shuffle(a);
}

}

function scratchKey(){return game&&current()?current().id:null}
function redrawScratch(){
 let c=root.querySelector('canvas[data-scratch]');if(!c)return;
 let bounds=c.getBoundingClientRect(),w=Math.max(1,bounds.width),h=Math.max(1,bounds.height),ratio=window.devicePixelRatio||1;
 c.width=Math.round(w*ratio);c.height=Math.round(h*ratio);let ctx=c.getContext('2d');ctx.scale(ratio,ratio);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#173854';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';
 for(const path of (scratchStrokes.get(scratchKey())||[])){
  if(!path.length)continue;ctx.beginPath();ctx.moveTo(path[0][0]*w,path[0][1]*h);
  for(let j=1;j<path.length;j++)ctx.lineTo(path[j][0]*w,path[j][1]*h);
  if(path.length===1){ctx.lineTo(path[0][0]*w+.01,path[0][1]*h+.01)}ctx.stroke();
 }
}
root.addEventListener('pointerdown',e=>{
 const c=e.target.closest('canvas[data-scratch]');if(!c)return;
 e.preventDefault();c.setPointerCapture?.(e.pointerId);
 const r=c.getBoundingClientRect(),p=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];
 let k=scratchKey(),arr=scratchStrokes.get(k)||[];arr.push([p]);scratchStrokes.set(k,arr);scratchActive={id:e.pointerId,key:k};redrawScratch();
});
root.addEventListener('pointermove',e=>{
 if(!scratchActive||scratchActive.id!==e.pointerId)return;
 const c=root.querySelector('canvas[data-scratch]');if(!c)return;
 e.preventDefault();const r=c.getBoundingClientRect();const a=scratchStrokes.get(scratchActive.key);if(!a?.length)return;
 a[a.length-1].push([Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]);redrawScratch();
});
for(const name of ['pointerup','pointercancel'])root.addEventListener(name,e=>{if(scratchActive?.id===e.pointerId)scratchActive=null});
root.addEventListener('toggle',e=>{if(e.target.matches('.scratchbox')){scratchVisible=e.target.open;if(scratchVisible)redrawScratch()}},true);

function render(){root.innerHTML='<div class="screenfade">'+(mode==='home'?home():mode==='lesson'?lesson():mode==='fight'?fight():mode==='result'?result():mode==='progress'?progress():mode==='teacher'?teacher():mode==='mastery'?mastery():mode==='mastery-result'?masteryResult():shop())+'</div>';if(scratchVisible)requestAnimationFrame(redrawScratch)}
root.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,i=Number(b.dataset.i);
 if(a==='undoScratch'){let key=scratchKey(),rows=scratchStrokes.get(key)||[];rows.pop();scratchStrokes.set(key,rows);redrawScratch()}
 else if(a==='clearScratch'){scratchStrokes.delete(scratchKey());redrawScratch()}
 else if(a==='home'){mode='home';render()}
 else if(a==='lesson'){stage=i;mode='lesson';gbase=2;gx=2;render()}
 else if(a==='start')start()
 else if(a==='startMastery')startMastery()
 else if(a==='masteryAnswer')masteryAnswer()
 else if(a==='masteryNext')masteryNext()
 else if(a==='entryMode'&&game&&!feedback){game.entryMode=b.dataset.mode;game.whole='';game.numerator='';game.denominator='';render()}
 else if(a==='teacher'){mode='teacher';render()}
 else if(a==='addCustom')addCustom()
 else if(a==='removeCustom'){save.customQuestions=save.customQuestions.filter(x=>x.id!==b.dataset.id);persist();render()}
 else if(a==='exportTeacher')exportTeacher()
 else if(a==='teacherReset'){save.teacher={...teacherDefault};persist();render()}

 else if(a==='length'){let v=b.dataset.length;if(['quick','standard','long'].includes(v)){save.lengthMode=v;persist();render()}}
 else if(a==='pause')pauseGame()
 else if(a==='resume')resumeGame()
 else if(a==='review'){let due=dueQuestions();if(due.length){stage=due[0].skill;start(true)}}
 else if(a==='pick'&&!feedback&&(mode==='fight'||mode==='mastery')){pick=i;render()}
 else if(a==='hint'&&!feedback){game.hints=Math.min(3,game.hints+1);render()}
 else if(a==='answer')answer()
 else if(a==='remPick'&&game?.remedial){game.remPick=i;render()}
 else if(a==='remCheck')remedialCheck()
 else if(a==='retry')retry()
 else if(a==='next')next()
 else if(a==='progress'){mode='progress';render()}
 else if(a==='shop'){mode='shop';render()}
 else if(a==='chest')openChest()
 else if(a==='equip')equip(i)
 else if(a==='base'){gbase=Number(b.dataset.v);render()}
 else if(a==='sound'){sound=!sound;if(sound)notes('learn');render()}
 else if(a==='export')exportCSV()
});
root.addEventListener('input',e=>{if(e.target.dataset.act==='point'){gx=Number(e.target.value);render()}else if(e.target.dataset.entry){setInputValue(e.target.dataset.entry,e.target.value)}});
root.addEventListener('change',e=>{if(e.target.dataset.teacher){teacherSave(e.target.dataset.teacher,e.target.value)}else if(e.target.dataset.teacherStage!==undefined){let k=Number(e.target.dataset.teacherStage),list=new Set(save.teacher.stages);if(e.target.checked)list.add(k);else list.delete(k);save.teacher.stages=Array.from(list).sort((a,b)=>a-b);persist();render()}});
render();
})();
</script></body></html>
