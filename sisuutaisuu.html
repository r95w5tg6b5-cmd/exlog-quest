function masteryDeck(i){
 const list=shuffle(availableQuestions(i));
 let eligible=shuffle(list.filter(supportsInput)),a=eligible.slice(0,3);
 let taken=new Set(a.map(x=>x.id));

 return shuffle(a);
}

 let ok=game.masterySuccess,ss=save.mastery[stage];return `${head()}<div class="card result screenfade"><span class="big">${ok?'🏆':'📘'}</span><div class="eyebrow">MASTERY CHECK</div><h2>${ok?'自力で解けた！ 習得確認合格':'あと少し！ 苦手を復習しよう'}</h2><div class="masteryGrade">${game.hit} / 5</div><p>ヒントなし・再挑戦なしの独立テスト</p><div class="masteryTile ${ok?'passed':''}"><b>${ok?'🏅 習得の証を獲得！':'合格まであと '+Math.max(0,4-game.hit)+'問'}</b>${game.masteryFirst?'<div>🎁 初回合格報酬：+40 XP、+30コイン、特別称号</div>':''}<div>これまでの最高記録：${ss.best}/5</div></div>${game.wrong.length?`<div class="revisions"><b>📚 復習してから再挑戦</b>${game.wrong.map(x=>`<div class="rev">${x.example?`📘 ${esc(x.example)}　`: ''}${M(x.t)}<div>${R(x.steps)}</div></div>`).join('')}</div>`:''}<div class="actions" style="justify-content:center"><button class="btn" data-act="home">マップに戻る</button><button class="btn" data-act="lesson" data-i="${stage}">教科書を見直す</button><button class="btn primary" data-act="startMastery">もう一度挑戦</button></div></div>`;
}
function teacher(){
 let p=save.teacher,selected=save.customQuestions.filter(x=>allowedQuestion(x,x.skill)),total=L.reduce((a,_,i)=>a+availableQuestions(i).length,0),warn=teacherWarning();
 return `${head()}<div class="teacherhead"><div><div class="eyebrow">TEACHER CONTROL</div><h2>👩‍🏫 教師用・出題設定</h2></div><button class="btn" data-act="home">冒険マップへ</button></div>
 <div class="rule">この設定は現在の端末に保存されます。授業で生徒に同じ設定を配布する場合は、下部の「設定済みHTMLを保存」を使ってください。</div>
 <div class="card"><h3>① 出題する範囲</h3><div class="teacherGrid" style="margin:10px 0">
 <label><span class="fieldlabel">教科書の開始ページ</span><input class="fieldctrl" type="number" min="174" max="204" data-teacher="pageFrom" value="${p.pageFrom}"></label>
 <label><span class="fieldlabel">教科書の終了ページ</span><input class="fieldctrl" type="number" min="174" max="204" data-teacher="pageTo" value="${p.pageTo}"></label>
 <label><span class="fieldlabel">難易度</span><select class="fieldctrl" data-teacher="difficulty"><option value="basic" ${p.difficulty==='basic'?'selected':''}>基礎問題のみ</option><option value="standard" ${p.difficulty==='standard'?'selected':''}>基礎・標準</option><option value="all" ${p.difficulty==='all'?'selected':''}>基礎・標準・発展</option></select></label>
 <label><span class="fieldlabel">自力入力の割合</span><select class="fieldctrl" data-teacher="freeMode"><option value="choice" ${p.freeMode==='choice'?'selected':''}>4択のみ</option><option value="mixed" ${p.freeMode==='mixed'?'selected':''}>後半は自力入力（推奨）</option><option value="input" ${p.freeMode==='input'?'selected':''}>入力できる問題はすべて自力入力</option></select></label></div>
 <label><span class="fieldlabel">教科書の対応番号で絞り込み（空欄ならすべて）</span><input class="fieldctrl" data-teacher="example" type="text" list="book-ref-choices" value="${esc(p.example||'')}" placeholder="例：例題3、練習24、応用例題2"><datalist id="book-ref-choices">${[...new Set(refMap.flatMap(a=>a.map(x=>x[0])))].map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist></label>
 <div class="sub" style="margin:7px 0">教科書の問いと同じ形式の類題を順番に出題します。既存のオリジナル類題には、教科書の対応番号と問題集の参照番号を付けてあります。例題番号でも絞り込めます。</div>
 <h3 style="margin:16px 0 9px">単元の選択</h3><div class="teacherStages">${L.map((x,i)=>`<label><input type="checkbox" data-teacher-stage="${i}" ${p.stages.includes(i)?'checked':''}><span>${x[0]} ${i+1}. ${x[1]}<small class="sub" style="display:block">${x[2]}</small></span></label>`).join('')}</div>
 ${warn?`<div class="teacheralert">⚠️ ${esc(warn)}</div>`:''}<div class="teacherok">📊 現在の条件に合う出題候補：<b>${total}問</b>（教師追加の問題：${selected.length}問）</div></div>
 <div class="card"><h3>② 例題・練習問題に合わせた問題を追加</h3><p class="sub">自作の問題をTeXで入力できます。例題番号を付ければ、その番号だけで出題できます。著作物の例題文をそのまま公開する場合は権利に注意してください。</p><div class="teacherGrid" style="margin:10px 0">
 <label><span class="fieldlabel">単元</span><select class="fieldctrl" id="newStage">${L.map((x,i)=>`<option value="${i}">${i+1}. ${x[1]}</option>`).join('')}</select></label>
 <label><span class="fieldlabel">教科書ページ</span><input class="fieldctrl" type="number" id="newPage" min="174" max="204" value="175"></label>
 <label><span class="fieldlabel">例題番号／練習番号</span><input class="fieldctrl" type="text" id="newExample" placeholder="例：例題3"></label>
 <label><span class="fieldlabel">問題の難易度</span><select class="fieldctrl" id="newDifficulty"><option value="1">基礎</option><option value="2" selected>標準</option><option value="3">発展</option></select></label></div>
 <label><span class="fieldlabel">問題文の数式（TeX）</span><input class="fieldctrl" type="text" id="newQuestion" placeholder="例：\\frac{2^5}{2^3}"></label>
 <label><span class="fieldlabel">正解（TeX。数値は入力式にも対応）</span><input class="fieldctrl" type="text" id="newAnswer" placeholder="例：4"></label>
 <div class="teacherGrid"><label><span class="fieldlabel">不正解選択肢1</span><input class="fieldctrl" type="text" id="newWrong1" placeholder="例：8"></label><label><span class="fieldlabel">不正解選択肢2</span><input class="fieldctrl" type="text" id="newWrong2" placeholder="例：16"></label><label><span class="fieldlabel">不正解選択肢3</span><input class="fieldctrl" type="text" id="newWrong3" placeholder="例：2"></label></div>
 <label><span class="fieldlabel">途中式・解説（TeX）</span><textarea class="fieldctrl" id="newSteps" placeholder="例：\\frac{2^5}{2^3}=2^{5-3}=4"></textarea></label>
 <div class="actions"><button class="btn primary" data-act="addCustom">➕ 問題を登録する</button><span class="sub">登録済み：${save.customQuestions.length}問</span></div>
 ${save.customQuestions.map(x=>`<div class="customsmall"><b>${esc(L[x.skill]?.[1]||'単元')}　p.${x.page}　${esc(x.example||'')}　難易度${x.difficulty}</b><div>${M(x.t)}　正解：${M(x.a)}</div><button class="btn" data-act="removeCustom" data-id="${esc(x.id)}">削除</button></div>`).join('')}</div>
 <div class="card"><h3>③ 授業用ファイルに反映</h3><p class="sub">現在の設定と教師追加の問題を埋め込んだ単一のHTMLを作成できます。生徒はリンクを開くだけで指定した教材に取り組めます。生徒の学習記録は個々のブラウザに保存されます。</p><div class="actions"><button class="btn primary" data-act="exportTeacher">📤 設定済みHTMLを保存</button><button class="btn" data-act="teacherReset">設定を初期化</button><button class="btn" data-act="home">マップへ</button></div></div>`;
}
function teacherSave(field,value){
 let p=save.teacher;
 if(field==='pageFrom'||field==='pageTo'){let v=Math.max(174,Math.min(204,Number(value)||174));p[field]=v;if(p.pageFrom>p.pageTo){if(field==='pageFrom')p.pageTo=v;else p.pageFrom=v}}
 else if(field==='example')p.example=String(value).trim();
 else if(field==='difficulty'&&['basic','standard','all'].includes(value))p.difficulty=value;
 else if(field==='freeMode'&&['choice','mixed','input'].includes(value))p.freeMode=value;
 persist();render()
}
function addCustom(){
 let get=id=>root.querySelector('#'+id)?.value.trim()||'';
 let st=Number(get('newStage')),page=Number(get('newPage')),
 t=get('newQuestion'),a=get('newAnswer'),w=[get('newWrong1'),get('newWrong2'),get('newWrong3')],steps=get('newSteps');
 if(!Number.isInteger(st)||st<0||st>13||!Number.isInteger(page)||page<174||page>204||!t||!a||w.some(v=>!v)||!steps){alert('単元・ページ・問題・正解・3つの選択肢・解説をすべて入力してください。');return}
 if(new Set([a,...w]).size!==4){alert('正解と不正解の選択肢は、4つとも異なる内容にしてください。');return}
 let val={id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*1e5),skill:st,page,example:get('newExample'),difficulty:Number(get('newDifficulty')),t,a,w,steps:T`\\(${steps}\\)`,h:'使う公式と条件を確認しよう。',note:'教師作成問題',kind:'choice',custom:true};
 // Correctly delimit TeX as \( ... \).
 val.steps='\\('+steps+'\\)';
 save.customQuestions.push(val);persist();render();alert('問題を登録しました。出題設定の範囲を確認してください。')
}
function exportTeacher(){
 try{
  let cp=document.documentElement.cloneNode(true),h=cp.querySelector('head');
  cp.querySelector('#eqrApp').innerHTML='';
  let old=h.querySelector('#teacher-preset');if(old)old.remove();
  let script=document.createElement('script');script.id='teacher-preset';script.type='application/json';script.textContent=JSON.stringify({teacher:save.teacher,customQuestions:save.customQuestions}).replace(/</g,'\\u003c');
  h.appendChild(script);
  let html='<!doctype html>\n'+cp.outerHTML,url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  let a=document.createElement('a');a.href=url;a.download='指数対数クエスト_授業配布用.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
 }catch(e){alert('この環境ではファイルの保存ができません。SafariなどのブラウザでHTML版を開いてください。')}
}

function scratchKey(){return game&&current()?current().id:null}
function redrawScratch(){
 const c=root.querySelector('canvas[data-scratch]');if(!c)return;
 const bounds=c.getBoundingClientRect(),w=Math.max(1,bounds.width),h=Math.max(1,bounds.height),ratio=Math.min(3,window.devicePixelRatio||1);
 const wantW=Math.round(w*ratio),wantH=Math.round(h*ratio);
 // リサイズは必要な場合だけ。毎回width/heightを書き換えるとiPadで連続線が切れる。
 if(c.width!==wantW||c.height!==wantH){c.width=wantW;c.height=wantH;}
 const ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#174869';ctx.lineWidth=3.3;ctx.lineJoin='round';ctx.lineCap='round';
 for(const path of(scratchStrokes.get(scratchKey())||[])){
  if(!path.length)continue;ctx.beginPath();ctx.moveTo(path[0][0]*w,path[0][1]*h);
  for(let j=1;j<path.length;j++)ctx.lineTo(path[j][0]*w,path[j][1]*h);
  if(path.length===1){ctx.lineTo(path[0][0]*w+.1,path[0][1]*h+.1)}ctx.stroke();
 }
}
const scratchPos=(c,e)=>{const r=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
root.addEventListener('pointerdown',e=>{
 const c=e.target.closest('canvas[data-scratch]');if(!c)return;e.preventDefault();
 scratchActive={id:e.pointerId,key:scratchKey()};
 const arr=scratchStrokes.get(scratchActive.key)||[];arr.push([scratchPos(c,e)]);scratchStrokes.set(scratchActive.key,arr);
 try{c.setPointerCapture(e.pointerId)}catch(err){}redrawScratch();
},{passive:false});
root.addEventListener('pointermove',e=>{
 if(!scratchActive||scratchActive.id!==e.pointerId)return;
 const c=root.querySelector('canvas[data-scratch]');if(!c)return;e.preventDefault();
 const paths=scratchStrokes.get(scratchActive.key);if(!paths?.length)return;
 const events=e.getCoalescedEvents?.()||[e];
 for(const ev of events)paths[paths.length-1].push(scratchPos(c,ev));
 redrawScratch();
},{passive:false});
for(const name of ['pointerup','pointercancel','lostpointercapture'])root.addEventListener(name,e=>{
 if(scratchActive?.id===e.pointerId){scratchActive=null;redrawScratch()}
});
window.addEventListener('resize',()=>{if(scratchVisible)redrawScratch()});
root.addEventListener('toggle',e=>{if(e.target.matches('.scratchbox')){scratchVisible=e.target.open;if(scratchVisible)requestAnimationFrame(redrawScratch)}},true);


function audit(){
 const rows=(refMap[stage]||[]).flatMap(([ref,page])=>{
  const xs=banks[stage].filter(x=>x.example===ref),done=new Set();
  return xs.filter(x=>{if(done.has(x.subpart))return false;done.add(x.subpart);return true}).map(x=>`<div class="audititem"><div class="refbanner">📘 ${esc(ref)} (${x.subpart}) ${ref.startsWith('問題集')?'問題集 p.98':'教科書 p.'+x.page}</div><div class="question">${M(x.t)}</div><div style="line-height:2.1"><b>正解：</b>${M(x.a)}</div><div class="auditsteps">${R(x.steps)}</div></div>`);
 });
 return `${head()}<div class="card"><div class="eyebrow">TEACHER REVIEW</div><h2>📚 教材の小問と問題の照合</h2><p>実際の出題内容・正解・式変形を見られます。出題前の先生用チェックにお使いください。</p><div class="auditnav">${L.slice(0,13).map((v,i)=>`<button data-act="auditStage" data-i="${i}" class="btn ${stage===i?'primary':''}">${i+1}. ${v[1]}</button>`).join('')}</div><div class="sub">${L[stage][1]} ／ 標準コース ${rows.length}小問（追加の類題は別候補）</div>${rows.join('')}</div>`;
}
function render(){root.innerHTML='<div class="screenfade">'+(mode==='home'?home():mode==='lesson'?lesson():mode==='fight'?fight():mode==='result'?result():mode==='progress'?progress():mode==='teacher'?teacher():mode==='audit'?audit():mode==='mastery'?mastery():mode==='mastery-result'?masteryResult():shop())+'</div>';if(scratchVisible)requestAnimationFrame(redrawScratch)}
root.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,i=Number(b.dataset.i);
 if(a==='undoScratch'){let key=scratchKey(),rows=scratchStrokes.get(key)||[];rows.pop();scratchStrokes.set(key,rows);redrawScratch()}
 else if(a==='clearScratch'){scratchStrokes.delete(scratchKey());redrawScratch()}
 else if(a==='home'){mode='home';render()}
 else if(a==='lesson'){stage=i;mode='lesson';gbase=3;gx=2;render()}
 else if(a==='start')start()
 else if(a==='startMastery')startMastery()
 else if(a==='masteryAnswer')masteryAnswer()
 else if(a==='masteryNext')masteryNext()
 else if(a==='entryMode'&&game&&!feedback){game.entryMode=b.dataset.mode;game.whole='';game.numerator='';game.denominator='';render()}
 else if(a==='teacher'){mode='teacher';render()}
 else if(a==='audit'){mode='audit';stage=0;render()}
 else if(a==='auditStage'){stage=i;render()}
 else if(a==='addCustom')addCustom()
 else if(a==='removeCustom'){save.customQuestions=save.customQuestions.filter(x=>x.id!==b.dataset.id);persist();render()}
 else if(a==='exportTeacher')exportTeacher()
 else if(a==='teacherReset'){save.teacher={...teacherDefault};persist();render()}

 else if(a==='length'){let v=b.dataset.length;if(['quick','standard','long'].includes(v)){save.lengthMode=v;persist();render()}}
 else if(a==='pause')pauseGame()
 else if(a==='resume')resumeGame()
 else if(a==='review'){let due=dueQuestions();if(due.length){stage=due[0].skill;start(true)}}
 else if(a==='pick'&&!feedback&&(mode==='fight'||mode==='mastery')){pick=i;render()}
 else if(a==='hint'&&!feedback){game.hints=Math.min(3,game.hints+1);render()}
 else if(a==='answer')answer()
 else if(a==='remPick'&&game?.remedial){game.remPick=i;render()}
 else if(a==='remCheck')remedialCheck()
 else if(a==='retry')retry()
 else if(a==='next')next()
 else if(a==='progress'){mode='progress';render()}
 else if(a==='shop'){mode='shop';render()}
 else if(a==='chest')openChest()
 else if(a==='equip')equip(i)
 else if(a==='base'){gbase=Number(b.dataset.v);render()}
 else if(a==='sound'){sound=!sound;if(!sound){bgmOn=false;stopBgm()}else notes('learn');render()}
 else if(a==='bgm'){bgmOn=!bgmOn;if(bgmOn){sound=true;startBgm();notes('learn')}else stopBgm();render()}
 else if(a==='export')exportCSV()
});
root.addEventListener('input',e=>{if(e.target.dataset.act==='point'){gx=Number(e.target.value);render()}else if(e.target.dataset.entry){setInputValue(e.target.dataset.entry,e.target.value)}});
root.addEventListener('change',e=>{if(e.target.dataset.teacher){teacherSave(e.target.dataset.teacher,e.target.value)}else if(e.target.dataset.teacherStage!==undefined){let k=Number(e.target.dataset.teacherStage),list=new Set(save.teacher.stages);if(e.target.checked)list.add(k);else list.delete(k);save.teacher.stages=Array.from(list).sort((a,b)=>a-b);persist();render()}});
render();
})();
</script></body></html>
