// v7 studio-style, original procedural sound design (embedded AAC, plays offline in iPad Safari).
let bgmOn=false,bgmHandle=null,bgmStep=0;let audioSlots={};
function playClip(name,volume=1,delay=0){
 if(!sound)return;
 const run=()=>{try{
  if(!sound)return;
  let a=new Audio(CLIP_ASSETS[name]||CLIP_ASSETS.click);
  a.volume=Math.max(0,Math.min(1,Number(save.sfxVolume??.7)*volume));
  a.preload='auto';a.play().catch(()=>{});a.addEventListener('ended',()=>{a.src='';},{once:true});
  }catch(e){}};
 if(delay>0)setTimeout(run,delay);else run();
}
function notes(kind){
 if(!sound)return;
 let type=GEARS[save.equipped]?.effect||'basic';
 if(kind==='hit'||kind==='win'){
  playClip('charge',.65);
  playClip(['thunder','solar','royal'].includes(type)?'thunder':['ice','moon','time'].includes(type)?'ice':['flame','dragon','forest'].includes(type)?'fire':'light',.85,330);
  playClip('impact',.62,740);
  if(kind==='win')playClip('victory',.84,1100);
 } else if(kind==='chest')playClip('chest',1);
 else if(kind==='miss')playClip('incorrect',.58);
 else playClip('click',.45);
}
function startBgm(){
 if(bgmHandle){try{bgmHandle.volume=Math.min(.6,Number(save.bgmVolume??.22));bgmHandle.play().catch(()=>{})}catch(e){};return}
 try{bgmHandle=new Audio(CLIP_ASSETS.ambient);bgmHandle.loop=true;bgmHandle.volume=Math.min(.6,Number(save.bgmVolume??.22));bgmHandle.preload='auto';bgmHandle.play().catch(()=>{})}catch(e){bgmHandle=null}
}
function stopBgm(){try{bgmHandle?.pause();if(bgmHandle)bgmHandle.currentTime=0}catch(e){}bgmHandle=null}
window.addEventListener('pagehide',stopBgm);
document.addEventListener('visibilitychange',()=>{if(document.hidden){bgmHandle?.pause()}else if(bgmOn&&sound)startBgm()});
const today=()=>new Date().toLocaleDateString('en-CA');
function getRec(q){return save.records[q.id]||{miss:0,right:0,days:[],mastered:false,dueAt:0}}
function writeRec(q,ok){let x=getRec(q);if(ok){x.right++;if(!x.days.includes(today()))x.days.push(today());if(x.days.length>=2&&x.right>=2)x.mastered=true;x.dueAt=Date.now()+ (x.mastered?7:1)*86400000}else{x.miss++;x.mastered=false;x.dueAt=Date.now()}save.records[q.id]=x;persist()}
function recordStage(ok){let x=save.stageStats[stage]||{right:0,attempts:0};x.attempts++;if(ok)x.right++;save.stageStats[stage]=x;persist()}
const dueQuestions=()=>banks.flat().filter(a=>save.records[a.id]&&save.records[a.id].miss>0&&!save.records[a.id].mastered&&save.records[a.id].dueAt<=Date.now());
const masteredCount=()=>Object.values(save.records).filter(x=>x.mastered).length;
function earnBadge(name){if(save.badges.includes(name))return false;save.badges.push(name);save.coins+=5;persist();return true}

function finishMastery(){
 const success=game.hit>=4,prior=save.mastery[stage]||{best:0,passed:false};
 const first=success&&!prior.passed;save.mastery[stage]={best:Math.max(prior.best,game.hit),last:game.hit,passed:success||prior.passed,at:today()};
 if(first){save.coins+=30;save.xp+=40;earnBadge(`第${stage+1}章・自力で解けた証`);if(stage===13)earnBadge('指数・対数マスター')}
 game.masterySuccess=success;game.masteryFirst=first;persist();mode='mastery-result';render();notes(success?'win':'learn')
}
function masteryResult(){
 let ok=game.masterySuccess,ss=save.mastery[stage];return `${head()}<div class="card result screenfade"><span class="big">${ok?'🏆':'📘'}</span><div class="eyebrow">MASTERY CHECK</div><h2>${ok?'自力で解けた！ 習得確認合格':'あと少し！ 苦手を復習しよう'}</h2><div class="masteryGrade">${game.hit} / 5</div><p>ヒントなし・再挑戦なしの独立テスト</p><div class="masteryTile ${ok?'passed':''}"><b>${ok?'🏅 習得の証を獲得！':'合格まであと '+Math.max(0,4-game.hit)+'問'}</b>${game.masteryFirst?'<div>🎁 初回合格報酬：+40 XP、+30コイン、特別称号</div>':''}<div>これまでの最高記録：${ss.best}/5</div></div>${game.wrong.length?`<div class="revisions"><b>📚 復習してから再挑戦</b>${game.wrong.map(x=>`<div class="rev">${x.example?`📘 ${esc(x.example)}　`: ''}${M(x.t)}<div>${R(x.steps)}</div></div>`).join('')}</div>`:''}<div class="actions" style="justify-content:center"><button class="btn" data-act="home">マップに戻る</button><button class="btn" data-act="lesson" data-i="${stage}">教科書を見直す</button><button class="btn primary" data-act="startMastery">もう一度挑戦</button></div></div>`;
}
function scratchKey(){return game&&current()?current().id:null}
function redrawScratch(){
 const c=root.querySelector('canvas[data-scratch]');if(!c)return;
 const bounds=c.getBoundingClientRect(),w=Math.max(1,bounds.width),h=Math.max(1,bounds.height),ratio=Math.min(3,window.devicePixelRatio||1);
 const wantW=Math.round(w*ratio),wantH=Math.round(h*ratio);
 // リサイズは必要な場合だけ。毎回width/heightを書き換えるとiPadで連続線が切れる。
 if(c.width!==wantW||c.height!==wantH){c.width=wantW;c.height=wantH;}
 const ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#174869';ctx.lineWidth=3.3;ctx.lineJoin='round';ctx.lineCap='round';
 for(const path of(scratchStrokes.get(scratchKey())||[])){
  if(!path.length)continue;ctx.beginPath();ctx.moveTo(path[0][0]*w,path[0][1]*h);
  for(let j=1;j<path.length;j++)ctx.lineTo(path[j][0]*w,path[j][1]*h);
  if(path.length===1){ctx.lineTo(path[0][0]*w+.1,path[0][1]*h+.1)}ctx.stroke();
 }
}
const scratchPos=(c,e)=>{const r=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
root.addEventListener('pointerdown',e=>{
 const c=e.target.closest('canvas[data-scratch]');if(!c)return;e.preventDefault();
 scratchActive={id:e.pointerId,key:scratchKey()};
 const arr=scratchStrokes.get(scratchActive.key)||[];arr.push([scratchPos(c,e)]);scratchStrokes.set(scratchActive.key,arr);
 try{c.setPointerCapture(e.pointerId)}catch(err){}redrawScratch();
},{passive:false});
root.addEventListener('pointermove',e=>{
 if(!scratchActive||scratchActive.id!==e.pointerId)return;
 const c=root.querySelector('canvas[data-scratch]');if(!c)return;e.preventDefault();
 const paths=scratchStrokes.get(scratchActive.key);if(!paths?.length)return;
 const events=e.getCoalescedEvents?.()||[e];
 for(const ev of events)paths[paths.length-1].push(scratchPos(c,ev));
 redrawScratch();
},{passive:false});
for(const name of ['pointerup','pointercancel','lostpointercapture'])root.addEventListener(name,e=>{
 if(scratchActive?.id===e.pointerId){scratchActive=null;redrawScratch()}
});
window.addEventListener('resize',()=>{if(scratchVisible)redrawScratch()});
root.addEventListener('toggle',e=>{if(e.target.matches('.scratchbox')){scratchVisible=e.target.open;if(scratchVisible)requestAnimationFrame(redrawScratch)}},true);


function soundSettings(){return `${head()}<div class="card"><div class="eyebrow">AUDIO / ACCESSIBILITY</div><h2>🎧 音と演出の設定</h2><p>効果音とBGMは初期設定でOFF。授業中は無音のまま使えます。各音はオリジナル制作で、ネット接続は不要です。</p><div class="volume-card"><label>魔法・撃破などの効果音　<strong id="sfxV">${Math.round((save.sfxVolume??.65)*100)}%</strong><input type="range" min="0" max="100" value="${Math.round((save.sfxVolume??.65)*100)}" data-volume="sfxVolume"></label><button data-act="testSfx" class="btn">試聴する</button></div><div class="volume-card"><label>BGM音量　<strong id="bgmV">${Math.round((save.bgmVolume??.18)*100)}%</strong><input type="range" min="0" max="60" value="${Math.round((save.bgmVolume??.18)*100)}" data-volume="bgmVolume"></label></div><div class="volume-card"><b>動きの設定</b><div class="actions"><button class="btn ${save.motion==='full'?'primary':''}" data-act="motion" data-value="full">✨ 通常演出</button><button class="btn ${save.motion==='soft'?'primary':''}" data-act="motion" data-value="soft">🍀 控えめ</button></div><p class="sub">点滅が苦手な生徒は「控えめ」を選べます。制限時間はありません。</p></div><button data-act="home" class="btn primary">冒険へ戻る</button></div>`}
function render(){root.innerHTML='<div class="screenfade">'+(mode==='home'?home():mode==='lesson'?lesson():mode==='fight'?fight():mode==='result'?result():mode==='progress'?progress():mode==='profile'?profileView():mode==='mastery'?mastery():mode==='mastery-result'?masteryResult():mode==='sound-settings'?soundSettings():shop())+'</div>';if(scratchVisible)requestAnimationFrame(redrawScratch)}
root.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,i=Number(b.dataset.i);
 if(a==='undoScratch'){let key=scratchKey(),rows=scratchStrokes.get(key)||[];rows.pop();scratchStrokes.set(key,rows);redrawScratch()}
 else if(a==='clearScratch'){scratchStrokes.delete(scratchKey());redrawScratch()}
 else if(a==='home'){mode='home';render()}
 else if(a==='profile'){mode='profile';render()}
 else if(a==='saveProfile')saveProfile()
 else if(a==='flush'){flushEvents();render()}
 else if(a==='lesson'){stage=i;mode='lesson';gbase=3;gx=2;render()}
 else if(a==='start')start()
 else if(a==='startMastery')startMastery()
 else if(a==='masteryAnswer')masteryAnswer()
 else if(a==='masteryNext')masteryNext()
 else if(a==='entryMode'&&game&&!feedback){game.entryMode=b.dataset.mode;game.whole='';game.numerator='';game.denominator='';render()}

 else if(a==='length'){let v=b.dataset.length;if(['quick','standard','long'].includes(v)){save.lengthMode=v;persist();render()}}
 else if(a==='pause')pauseGame()
 else if(a==='resume')resumeGame()
 else if(a==='review'){let due=dueQuestions();if(due.length){stage=due[0].skill;start(true)}}
 else if(a==='pick'&&!feedback&&(mode==='fight'||mode==='mastery')){pick=i;render()}
 else if(a==='hint'&&!feedback){game.hints=Math.min(3,game.hints+1);render()}
 else if(a==='answer')answer()
 else if(a==='remPick'&&game?.remedial){game.remPick=i;render()}
 else if(a==='remCheck')remedialCheck()
 else if(a==='retry')retry()
 else if(a==='next')next()
 else if(a==='progress'){mode='progress';render()}
 else if(a==='shop'){mode='shop';render()}
 else if(a==='chest')openChest()
 else if(a==='equip')equip(i)
 else if(a==='base'){gbase=Number(b.dataset.v);render()}
 else if(a==='soundSettings'){mode='sound-settings';render()}
 else if(a==='testSfx'){if(!sound)sound=true;notes('hit');render()}
 else if(a==='motion'){save.motion=b.dataset.value==='soft'?'soft':'full';persist();host.classList.toggle('soft-motion',save.motion==='soft');render()}
 else if(a==='sound'){sound=!sound;if(!sound){bgmOn=false;stopBgm()}else notes('learn');render()}
 else if(a==='bgm'){bgmOn=!bgmOn;if(bgmOn){sound=true;startBgm();notes('learn')}else stopBgm();render()}
 else if(a==='export')exportCSV()
});
root.addEventListener('input',e=>{if(e.target.dataset.volume){let n=e.target.dataset.volume;save[n]=Number(e.target.value)/100;persist();if(n==='bgmVolume'&&bgmHandle)bgmHandle.volume=Math.min(.6,save.bgmVolume);let label=root.querySelector(n==='sfxVolume'?'#sfxV':'#bgmV');if(label)label.textContent=Math.round(save[n]*100)+'%';return}if(e.target.dataset.act==='point'){gx=Number(e.target.value);render()}else if(e.target.dataset.entry){setInputValue(e.target.dataset.entry,e.target.value)}});

window.addEventListener('online',scheduleSend);host.classList.toggle('soft-motion',save.motion==='soft');render();scheduleSend();
})();
</script></body></html>
